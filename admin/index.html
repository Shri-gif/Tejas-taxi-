<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tejas Taxi Admin</title><link rel="stylesheet" href="admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script></head><body><div id="login" class="panel"><h1>Tejas Taxi</h1><p>Admin Login</p><form id="loginForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Login</button><div id="loginMsg"></div></form></div><div id="app" hidden><header><b>TEJAS TAXI ADMIN</b><button id="logout">Logout</button></header><main><aside><button class="tab active" data-tab="cars">🚕 Cars</button><button class="tab" data-tab="info">⚙️ Website info</button></aside><section><div id="carsTab"><div class="section-title"><div><small>FLEET MANAGEMENT</small><h2>Cars</h2></div><button id="newCar">+ Add car</button></div><div id="carsList"></div><div id="carEditor" class="editor" hidden><h3 id="editorTitle">Add car</h3><form id="carForm"><input type="hidden" id="carId"><label>Car name<input id="carName" required placeholder="Maruti Suzuki Dzire"></label><label>Category<input id="carCategory" placeholder="Comfort Sedan"></label><label>Price per km<input id="carPrice" type="number" step="0.01" placeholder="12"></label><label>Seats<input id="carSeats" type="number" placeholder="4"></label><label>Luggage<input id="carLuggage" placeholder="2 large bags"></label><label>Photo URL<input id="carImage" placeholder="https://.../car.jpg"></label><label>Features<input id="carFeatures" placeholder="One way, Round trip, AC"></label><label class="check"><input id="carActive" type="checkbox" checked> Show on website</label><div class="actions"><button type="button" id="cancel">Cancel</button><button>Save car</button></div><div id="carMsg"></div></form></div></div><div id="infoTab" hidden><h2>Website info</h2><p>Website settings will be connected in the next phase.</p></div></section></main></div><script src="admin.js"></script></body></html>
